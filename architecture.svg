<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1a202c">Electronics RAG Assistant — Architecture</text>

  <!-- User -->
  <rect x="370" y="60" width="160" height="55" rx="10" fill="#EBF8FF" stroke="#3182CE" stroke-width="2"/>
  <text x="450" y="93" text-anchor="middle" font-size="16" font-weight="600" fill="#2C5282">User</text>

  <!-- Arrow user -> frontend -->
  <line x1="450" y1="115" x2="450" y2="150" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="138" font-size="12" fill="#4a5568">question / image</text>

  <!-- Frontend -->
  <rect x="330" y="150" width="240" height="60" rx="10" fill="#FEFCBF" stroke="#D69E2E" stroke-width="2"/>
  <text x="450" y="176" text-anchor="middle" font-size="16" font-weight="600" fill="#744210">Streamlit Frontend</text>
  <text x="450" y="196" text-anchor="middle" font-size="12" fill="#744210">app.py + api_client.py</text>

  <!-- Arrow frontend -> backend -->
  <line x1="450" y1="210" x2="450" y2="250" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="234" font-size="12" fill="#4a5568">HTTP (REST API)</text>

  <!-- Backend -->
  <rect x="300" y="250" width="300" height="70" rx="10" fill="#F0FFF4" stroke="#38A169" stroke-width="2"/>
  <text x="450" y="278" text-anchor="middle" font-size="16" font-weight="600" fill="#22543D">FastAPI Backend</text>
  <text x="450" y="298" text-anchor="middle" font-size="12" fill="#22543D">/health · /query · /query-image</text>

  <!-- Arrows backend -> 3 services -->
  <line x1="360" y1="320" x2="180" y2="400" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="320" x2="450" y2="400" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="320" x2="720" y2="400" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Vector store -->
  <rect x="60" y="400" width="240" height="70" rx="10" fill="#FAF5FF" stroke="#805AD5" stroke-width="2"/>
  <text x="180" y="428" text-anchor="middle" font-size="15" font-weight="600" fill="#44337A">Chroma Vector Store</text>
  <text x="180" y="448" text-anchor="middle" font-size="12" fill="#44337A">373 chunks · all-MiniLM-L6-v2</text>

  <!-- LLM -->
  <rect x="330" y="400" width="240" height="70" rx="10" fill="#FFF5F5" stroke="#E53E3E" stroke-width="2"/>
  <text x="450" y="428" text-anchor="middle" font-size="15" font-weight="600" fill="#742A2A">Ollama LLM</text>
  <text x="450" y="448" text-anchor="middle" font-size="12" fill="#742A2A">llama3.1 (local, grounded generation)</text>

  <!-- YOLO -->
  <rect x="600" y="400" width="240" height="70" rx="10" fill="#EBFFFA" stroke="#319795" stroke-width="2"/>
  <text x="720" y="422" text-anchor="middle" font-size="15" font-weight="600" fill="#234E52">YOLOv8n (fine-tuned)</text>
  <text x="720" y="440" text-anchor="middle" font-size="12" fill="#234E52">ElectroCom61 · 61 classes</text>
  <text x="720" y="458" text-anchor="middle" font-size="11" fill="#234E52" font-style="italic">image queries only</text>

  <!-- Grounded answer back to backend -->
  <line x1="180" y1="400" x2="380" y2="325" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="450" y1="400" x2="450" y2="325" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="720" y1="400" x2="520" y2="325" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Final answer back to user -->
  <path d="M 600 285 C 780 285, 780 130, 535 90" fill="none" stroke="#4a5568" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="700" y="180" font-size="12" fill="#4a5568">grounded, cited answer</text>

  <!-- Legend -->
  <rect x="60" y="505" width="14" height="14" fill="none" stroke="#4a5568" stroke-width="2"/>
  <text x="82" y="516" font-size="12" fill="#4a5568">solid = request flow</text>
  <line x1="230" y1="512" x2="255" y2="512" stroke="#4a5568" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="262" y="516" font-size="12" fill="#4a5568">dashed = response flow</text>
</svg>
